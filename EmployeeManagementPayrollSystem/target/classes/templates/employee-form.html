<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Employee Form</title><link rel="stylesheet" href="/style.css"></head><body><nav><b>Employee Payroll</b><a href="/">Dashboard</a><a href="/employees">Employees</a><a href="/payroll">Payroll</a></nav><main><h1>Employee Details</h1><form action="/employees/save" method="post"><input type="hidden" name="id" th:value="${employee.id}"><label>Name</label><input name="name" required th:value="${employee.name}"><label>Email</label><input type="email" name="email" required th:value="${employee.email}"><label>Department</label><input name="department" th:value="${employee.department}"><label>Designation</label><input name="designation" th:value="${employee.designation}"><label>Basic Salary</label><input type="number" name="basicSalary" min="0" step="0.01" required th:value="${employee.basicSalary}"><button class="btn" type="submit">Save</button> <a href="/employees">Cancel</a></form></main></body></html>
