<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Employees</title><link rel="stylesheet" href="/style.css"></head><body><nav><b>Employee Payroll</b><a href="/">Dashboard</a><a href="/employees">Employees</a><a href="/payroll">Payroll</a></nav><main><h1>Employees</h1><a class="btn" href="/employees/add">+ Add Employee</a><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Designation</th><th>Salary</th><th>Actions</th></tr></thead><tbody><tr th:each="e:${employees}"><td th:text="${e.id}"></td><td th:text="${e.name}"></td><td th:text="${e.email}"></td><td th:text="${e.department}"></td><td th:text="${e.designation}"></td><td th:text="${e.basicSalary}"></td><td><a th:href="@{/employees/edit/{id}(id=${e.id})}">Edit</a> | <a th:href="@{/employees/delete/{id}(id=${e.id})}" onclick="return confirm('Delete this employee?')">Delete</a></td></tr></tbody></table></main></body></html>
