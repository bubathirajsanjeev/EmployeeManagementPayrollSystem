<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Payroll</title><link rel="stylesheet" href="/style.css"></head><body><nav><b>Employee Payroll</b><a href="/">Dashboard</a><a href="/employees">Employees</a><a href="/payroll">Payroll</a></nav><main><h1>Generate Payroll</h1><form action="/payroll/generate" method="post" class="inline-form"><label>Employee</label><select name="employeeId" required><option value="">Select Employee</option><option th:each="e:${employees}" th:value="${e.id}" th:text="${e.name+' — '+e.basicSalary}"></option></select><label>Month</label><input name="month" placeholder="November 2026" required><label>Allowance</label><input type="number" name="allowance" value="0" step="0.01" required><label>Deduction</label><input type="number" name="deduction" value="0" step="0.01" required><button class="btn" type="submit">Generate</button></form><h2>Payroll Records</h2><table><thead><tr><th>Employee</th><th>Month</th><th>Basic</th><th>Allowance</th><th>Deduction</th><th>Net Salary</th><th>Date</th><th></th></tr></thead><tbody><tr th:each="p:${payrolls}"><td th:text="${p.employee.name}"></td><td th:text="${p.month}"></td><td th:text="${p.basicSalary}"></td><td th:text="${p.allowance}"></td><td th:text="${p.deduction}"></td><td th:text="${p.netSalary}"></td><td th:text="${p.generatedDate}"></td><td><a th:href="@{/payroll/delete/{id}(id=${p.id})}" onclick="return confirm('Delete payroll record?')">Delete</a></td></tr></tbody></table></main></body></html>
